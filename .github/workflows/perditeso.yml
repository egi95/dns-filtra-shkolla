# Every night: download every UT1 category and convert it to AdGuard syntax (||domain^ also blocks www. and subdomains)
name: Perditeso listat

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  perditeso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shkarko dhe konverto listat UT1
        run: |
          set -euo pipefail
          mkdir -p lists
          # every category of the mirror; "adult" (4.6M domains) is left out: too big for GitHub and for the routers
          cats=$(curl -fsSL --retry 3 https://api.github.com/repos/olbat/ut1-blacklists/contents/blacklists \
                 | python3 -c 'import json,sys; print(" ".join(sorted(x["name"] for x in json.load(sys.stdin) if x["type"]=="dir")))')
          for cat in $cats; do
            [ "$cat" = "adult" ] && continue
            if ! curl -fsSL --retry 3 "https://raw.githubusercontent.com/olbat/ut1-blacklists/master/blacklists/$cat/domains" -o "/tmp/$cat.txt"; then
              echo "UT1 $cat: pa skedar domains, kalohet"; continue
            fi
            # keep only plain domain names, drop IP addresses and comments
            tr -d '\r' < "/tmp/$cat.txt" | sed -E 's/^[*.]+//' | tr 'A-Z' 'a-z' \
              | { grep -E '^[a-z0-9-]+(\.[a-z0-9-]+)+$' || true; } | { grep -vE '^[0-9.]+$' || true; } | sort -u > "/tmp/$cat.clean"
            count=$(wc -l < "/tmp/$cat.clean")
            old=0
            [ -f "lists/ut1-$cat.txt" ] && old=$(grep -c '^||' "lists/ut1-$cat.txt" || true)
            # an empty or suddenly halved download means the source failed: keep yesterday's list
            if [ "$count" -eq 0 ] || [ "$count" -lt $((old / 2)) ]; then
              echo "UT1 $cat: $count domene (dje $old), lista nuk ndryshohet"; continue
            fi
            {
              echo "! Title: UT1 $cat (AdGuard)"
              echo "! Source: UT1, Universite Toulouse Capitole (https://dsi.ut-capitole.fr/blacklists/) via github.com/olbat/ut1-blacklists"
              echo "! License: CC BY-SA 4.0"
              echo "! Domains: $count"
              sed -E 's/.*/||&^/' "/tmp/$cat.clean"
            } > "lists/ut1-$cat.txt"
            echo "UT1 $cat: $count domene"
          done

          # combined lists used by the schools (always on): security and filter-bypass sites
          python3 - <<'PY'
          import os
          combined = {
              "bgt-siguria": ["ddos", "hacking", "cryptojacking", "stalkerware", "dangerous_material", "drogue",
                              "agressif", "warez", "dating", "tricheur"],
              "bgt-anashkalimi": ["vpn", "redirector"],
          }
          for name, cats in combined.items():
              doms = set()
              for c in cats:
                  path = f"lists/ut1-{c}.txt"
                  if os.path.exists(path):
                      doms |= {l.strip()[2:-1] for l in open(path) if l.startswith("||")}
              with open(f"lists/{name}.txt", "w") as f:
                  f.write(f"! Title: {name} (UT1: {', '.join(cats)})\n")
                  f.write("! Source: UT1, Universite Toulouse Capitole via github.com/olbat/ut1-blacklists\n")
                  f.write(f"! License: CC BY-SA 4.0\n! Domains: {len(doms)}\n")
                  f.writelines(f"||{d}^\n" for d in sorted(doms))
              print(f"{name}: {len(doms)} domene")
          PY

          # merged category lists: UT1 + HaGeZi + Block List Project + CasCas2 (games, torrent, social)
          python3 scripts/build_lists.py

          # index of all lists with their size and AdGuard URL
          {
            echo "# Listat (formati AdGuard)"
            echo
            echo "Perditesuar: $(date -u +'%F %H:%M') UTC. Burimi: UT1, Universite Toulouse Capitole, CC BY-SA 4.0."
            echo
            echo "| Lista | Domene | URL per AdGuard Home |"
            echo "|---|---|---|"
            for f in lists/bgt-*.txt lists/ut1-*.txt; do
              c=$(basename "$f" .txt)
              echo "| $c | $(grep -c '^||' "$f") | https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/$f |"
            done
          } > lists/README.md

      - name: Ruaj ndryshimet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lists
          git diff --cached --quiet && exit 0
          git commit -m "Perditesim automatik i listave $(date -u +%F)"
          git push

      # BGT 2: UniFi cannot read a list URL, so the Domain Lists and lesson policies are synced through its API.
      # (BGT 1 needs nothing here: its AdGuard Home downloads the lists itself every 24 h.)
      - name: Sinkronizo UniFi (BGT 2)
        if: github.repository == 'egi95/dns-filtra-shkolla'
        env:
          UNIFI_API_KEY: ${{ secrets.UNIFI_API_KEY }}
          UNIFI_CONSOLE: ${{ secrets.UNIFI_CONSOLE }}
        run: python3 scripts/unifi_sync.py
