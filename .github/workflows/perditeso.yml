# Every night: download every UT1 category and convert it to AdGuard syntax (||domain^ also blocks www. and subdomains)
name: Perditeso listat

on:
  schedule:
    - cron: "17 * * * *"  # Select by actual school time, including delayed starts.
  workflow_dispatch:
    inputs:
      allow_daytime_sync:
        description: "Lejo sinkronizimin manual UniFi pas ores 17:00"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: listat
  cancel-in-progress: false

jobs:
  window:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.time.outputs.proceed }}
      day: ${{ steps.time.outputs.day }}
      publish: ${{ steps.time.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/publication-window.sh
          sparse-checkout-cone-mode: false
      - id: time
        env:
          EVENT: ${{ github.event_name }}
          TZ: Europe/Belgrade
        run: |
          echo "day=$(date +%F)" >> "$GITHUB_OUTPUT"
          if bash scripts/publication-window.sh; then echo "publish=true" >> "$GITHUB_OUTPUT"; fi
          if [[ "$EVENT" == workflow_dispatch || $(date +%H) < 07 ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi
  perditeso:
    needs: window
    if: needs.window.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Kontrollo a eshte verifikuar kjo nate
        id: done
        uses: actions/cache/restore@v4
        with:
          path: .night-verified
          key: unifi-verified-v1-${{ needs.window.outputs.day }}
          lookup-only: true
      - name: Kontrollo publikimin e listave per sot
        id: published
        uses: actions/cache/restore@v4
        with:
          path: .lists-published
          key: lists-published-v1-${{ needs.window.outputs.day }}
          lookup-only: true
      - uses: actions/checkout@v4
        with:
          ref: main

      - id: refresh
        if: github.event_name == 'workflow_dispatch' || steps.published.outputs.cache-hit != 'true' || hashFiles('.ut1-pending') != ''
        run: echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Shkarko dhe konverto listat UT1
        if: steps.refresh.outputs.needed == 'true'
        run: |
          set -euo pipefail
          mkdir -p lists
          # All domain categories for the operational lists. The full archive, including adult and URL paths, is stored in Releases.
          # Read the source tree over Git, independently of the GitHub REST API quota.
          source_dir="$RUNNER_TEMP/ut1-source"
          for delay in 0 5 20; do
            sleep "$delay"
            if git clone --quiet --depth=1 --filter=blob:none --no-checkout --branch master \
              https://github.com/olbat/ut1-blacklists.git "$source_dir"; then
              break
            fi
          done
          revision=$(git -C "$source_dir" rev-parse --verify HEAD)
          git -C "$source_dir" ls-tree -r --name-only HEAD -- blacklists > "$RUNNER_TEMP/ut1-tree"
          sed -nE 's|^blacklists/([a-zA-Z0-9_-]+)/domains$|\1|p' "$RUNNER_TEMP/ut1-tree" > "$RUNNER_TEMP/ut1-categories"
          grep -Fxq vpn "$RUNNER_TEMP/ut1-categories"
          pending="$RUNNER_TEMP/ut1-pending"
          : > "$pending"
          report_pending() {
            echo "$cat" >> "$pending"
            echo "::warning::UT1 $cat: $1"
            echo "- UT1 $cat: $1" >> "$GITHUB_STEP_SUMMARY"
          }
          while IFS= read -r cat; do
            [ "$cat" = "adult" ] && continue
            if ! curl -fsSL --retry 3 --retry-all-errors --max-time 180 \
              "https://raw.githubusercontent.com/olbat/ut1-blacklists/$revision/blacklists/$cat/domains" -o "/tmp/$cat.txt"; then
              report_pending "Shkarkimi deshtoi. Kategoria mbetet per riprove."
              continue
            fi
            # keep only plain domain names, drop IP addresses and comments
            tr -d '\r' < "/tmp/$cat.txt" | sed -E 's/^[*.]+//' | tr 'A-Z' 'a-z' \
              | { grep -E '^[a-z0-9-]+(\.[a-z0-9-]+)+$' || true; } | { grep -vE '^[0-9.]+$' || true; } | sort -u > "/tmp/$cat.clean"
            count=$(wc -l < "/tmp/$cat.clean")
            old=0
            [ -f "lists/ut1-$cat.txt" ] && old=$(grep -c '^||' "lists/ut1-$cat.txt" || true)
            # an empty or suddenly halved download means the source failed: keep yesterday's list
            if [ "$count" -eq 0 ] || (( count * 2 < old )); then
              report_pending "$count domene (me pare $old). Kategoria mbetet per riprove."
              continue
            fi
            {
              echo "! Title: UT1 $cat (AdGuard)"
              echo "! Source: UT1, Universite Toulouse Capitole (https://dsi.ut-capitole.fr/blacklists/) via github.com/olbat/ut1-blacklists"
              echo "! License: CC BY-SA 4.0"
              echo "! Domains: $count"
              sed -E 's/.*/||&^/' "/tmp/$cat.clean"
            } > "lists/ut1-$cat.txt"
            echo "UT1 $cat: $count domene"
          done < "$RUNNER_TEMP/ut1-categories"

          # Detect a previously published category disappearing from the source catalogue.
          for file in lists/ut1-*.txt; do
            cat=${file#lists/ut1-}; cat=${cat%.txt}
            if ! grep -Fxq "$cat" "$RUNNER_TEMP/ut1-categories"; then
              report_pending "Kategoria mungon ne katalog."
            fi
          done
          sort -u "$pending" -o "$pending"
          if [[ -f .ut1-pending ]]; then
            comm -12 .ut1-pending "$pending" > "$RUNNER_TEMP/ut1-repeated"
          fi
          if [[ -s "$pending" ]]; then
            cp "$pending" .ut1-pending
          else
            rm -f .ut1-pending
          fi

          # combined lists used by the schools (always on): security and filter-bypass sites
          python3 - <<'PY'
          import os
          combined = {
              "bgt-siguria": ["ddos", "hacking", "cryptojacking", "stalkerware", "dangerous_material", "drogue",
                              "agressif", "warez", "dating", "tricheur"],
              "bgt-anashkalimi": ["vpn", "redirector", "residential-proxies", "doh"],
          }
          for name, cats in combined.items():
              doms = set()
              for c in cats:
                  path = f"lists/ut1-{c}.txt"
                  if os.path.exists(path):
                      doms |= {l.strip()[2:-1] for l in open(path) if l.startswith("||")}
              with open(f"lists/{name}.txt", "w") as f:
                  f.write(f"! Title: {name} (UT1: {', '.join(cats)})\n")
                  f.write("! Source: UT1, Universite Toulouse Capitole via github.com/olbat/ut1-blacklists\n")
                  f.write(f"! License: CC BY-SA 4.0\n! Domains: {len(doms)}\n")
                  f.writelines(f"||{d}^\n" for d in sorted(doms))
              print(f"{name}: {len(doms)} domene")
          PY

          # merged category lists: UT1 + HaGeZi + Block List Project + CasCas2 (games, torrent, social)
          python3 scripts/build_lists.py
          python3 scripts/build_student_filters.py

          # index of all lists with their size and AdGuard URL
          {
            echo "# Listat (formati AdGuard)"
            echo
            echo "Perditesuar: $(date -u +'%F %H:%M') UTC. Burimi: UT1, Universite Toulouse Capitole, CC BY-SA 4.0."
            echo
            echo "| Lista | Domene | URL per AdGuard Home |"
            echo "|---|---|---|"
            for f in lists/bgt-*.txt lists/ut1-*.txt; do
              c=$(basename "$f" .txt)
              echo "| $c | $(grep -c '^||' "$f") | https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/$f |"
            done
          } > lists/README.md

      - name: Ruaj ndryshimet
        if: steps.refresh.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lists
          if [[ -f .ut1-pending ]] || git ls-files --error-unmatch .ut1-pending >/dev/null 2>&1; then
            git add -A -- .ut1-pending
          fi
          git diff --cached --quiet && exit 0
          git commit -m "Perditesim automatik i listave $(date -u +%F)"
          git pull --rebase -q origin main
          bash scripts/publication-window.sh
          git push

      - name: Arkivo katalogun e plote zyrtar UT1
        if: steps.refresh.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 150 https://dsi.ut-capitole.fr/blacklists/download/all.tar.gz -o /tmp/ut1-all.tar.gz
          tar -tzf /tmp/ut1-all.tar.gz > /tmp/ut1-entries.txt
          grep -Eq '(^|/)adult/domains$' /tmp/ut1-entries.txt
          grep -Eq '(^|/)vpn/domains$' /tmp/ut1-entries.txt
          if ! gh release view ut1-catalog >/dev/null 2>&1; then
            bash scripts/publication-window.sh
            gh release create ut1-catalog --title "UT1 full category archive" --notes "Official Universite Toulouse Capitole archive, including adult domains and URL paths. Source: https://dsi.ut-capitole.fr/blacklists/" --latest=false
          fi
          bash scripts/publication-window.sh
          gh release upload ut1-catalog /tmp/ut1-all.tar.gz --clobber

      - name: Shenjo publikimin pas ruajtjes se listave dhe arkivit
        if: steps.published.outputs.cache-hit != 'true' && hashFiles('.ut1-pending') == ''
        run: touch .lists-published
      - uses: actions/cache/save@v4
        if: steps.published.outputs.cache-hit != 'true' && hashFiles('.ut1-pending') == ''
        with:
          path: .lists-published
          key: lists-published-v1-${{ needs.window.outputs.day }}

      # BGT 2: UniFi cannot read a list URL, so the Domain Lists and lesson policies are synced through its API.
      # (BGT 1 needs nothing here: its AdGuard Home downloads the lists itself every 24 h.)
      - name: Sinkronizo UniFi (BGT 2)
        id: sync
        if: github.repository == 'egi95/dns-filtra-shkolla' && needs.window.outputs.proceed == 'true' && (github.event_name == 'workflow_dispatch' || steps.done.outputs.cache-hit != 'true' || steps.refresh.outputs.needed == 'true')
        env:
          UNIFI_API_KEY: ${{ secrets.UNIFI_API_KEY }}
          UNIFI_CONSOLE: ${{ secrets.UNIFI_CONSOLE }}
          BGT_ALLOW_DAYTIME_SYNC: ${{ inputs.allow_daytime_sync }}
        run: |
          args=()
          if [ "$BGT_ALLOW_DAYTIME_SYNC" = "true" ]; then
            args+=(--allow-daytime)
          fi
          if [[ "$BGT_ALLOW_DAYTIME_SYNC" != true && $(TZ=Europe/Belgrade date +%H) > 06 ]]; then
            echo "Listat u publikuan. Zbatimi ne UniFi pret dritaren e nates." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bash scripts/publication-window.sh
          python3 scripts/unifi_sync.py "${args[@]}"
          touch .night-verified
      - name: Shenjo naten pas verifikimit ne router
        if: github.event_name == 'schedule' && steps.done.outputs.cache-hit != 'true' && hashFiles('.night-verified') != '' && hashFiles('.ut1-pending') == ''
        uses: actions/cache/save@v4
        with:
          path: .night-verified
          key: unifi-verified-v1-${{ needs.window.outputs.day }}

      - name: Sinjalizo kategorite qe deshtuan perseri
        if: steps.refresh.outputs.needed == 'true'
        run: |
          if [[ -s "$RUNNER_TEMP/ut1-repeated" ]]; then
            echo "::error::UT1 pret kontroll per kategorite: $(paste -sd, "$RUNNER_TEMP/ut1-repeated")"
            exit 1
          fi
